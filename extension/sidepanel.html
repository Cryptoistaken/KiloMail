<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KiloMail</title>
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <!-- kilomail.tech sends no X-Frame-Options and no CSP, so it frames cleanly.
       allow= hands the site the clipboard APIs it needs for its copy buttons. -->
  <iframe id="app" title="KiloMail" src="https://kilomail.tech/" allow="clipboard-read; clipboard-write"></iframe>
  <script src="sidepanel.js"></script>
</body>
</html>
