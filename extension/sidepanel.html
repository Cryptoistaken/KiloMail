<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KiloMail</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>

  <!-- Icon sprite (lucide, the same set the site uses). The stroke look is applied in CSS. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
    <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z"/></symbol>
    <symbol id="i-loader" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></symbol>
  </svg>

  <header class="bar">
    <span class="brand">
      <svg class="mark" viewBox="0 0 128 128" aria-hidden="true"
      ><path fill="currentColor" d="M31.748.46L.208 32l31.036 31.035l.504.504L63.288 32Zm64.504 0L64.712 32l31.54 31.54l.504-.505L127.79 32ZM64 32.714L32.46 64.252L64 95.792l31.54-31.54Zm-64 .504v30.826l31.244 31.244V64.461Zm128 0L96.965 64.252l-.21.209v30.826L128 64.043ZM32.252 65.469v30.826l31.244 31.244V96.713Zm63.496 0L64.504 96.713v30.826l31.244-31.244Z"/></svg>
      <span class="wordmark">KiloMail</span>
    </span>
    <span class="bar-actions">
      <button id="open-tab" class="icon-btn" title="Open KiloMail in a full tab" aria-label="Open KiloMail in a full tab"></button>
    </span>
  </header>

  <section class="address">
    <button id="new" class="icon-btn" title="New address on this domain" aria-label="New address on this domain"></button>
    <button id="addr" class="pill" title="Click to edit the address">
      <span id="addr-name" class="pill-name"></span>
      <span id="addr-domain" class="pill-domain"></span>
      <svg class="pill-pencil" aria-hidden="true"><use href="#i-pencil"/></svg>
    </button>
    <button id="copy" class="icon-btn" title="Copy address" aria-label="Copy address"></button>
  </section>

  <div id="editor" class="editor" hidden>
    <input id="edit-name" class="edit-input" placeholder="username" spellcheck="false" autocomplete="off">
    <span class="edit-at">@</span>
    <select id="edit-domain" class="edit-domain" aria-label="Domain"></select>
    <button id="edit-save" class="icon-btn solid" title="Use this address" aria-label="Use this address"></button>
  </div>

  <div class="meta">
    <span id="count" class="count"></span>
    <span class="status">
      <span id="live" class="live"><i></i><span id="live-text">connecting…</span></span>
      <button id="refresh" class="icon-btn sm" title="Refresh inbox" aria-label="Refresh inbox"></button>
    </span>
  </div>

  <main id="list" class="list" aria-live="polite"></main>
  <article id="msg" class="msg" hidden></article>
  <section id="history" class="history" hidden></section>

  <footer class="dockwrap">
    <div id="domain-menu" class="menu" hidden></div>
    <nav class="dock" id="dock" aria-label="KiloMail">
      <button class="dock-btn" data-dock="inbox"   title="Inbox"   aria-label="Inbox"></button>
      <button class="dock-btn" data-dock="history" title="History" aria-label="History"></button>
      <button class="dock-btn" data-dock="new"     title="New inbox (pick domain)" aria-label="New inbox"></button>
      <button class="dock-btn" data-dock="docs"    title="API docs" aria-label="API docs"></button>
      <button class="dock-btn" data-dock="theme"   title="Toggle theme" aria-label="Toggle theme"></button>
    </nav>
  </footer>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
